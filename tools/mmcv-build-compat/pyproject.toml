[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmcv-build-compat"
version = "0.1.3"
description = "Build-time compatibility shim for mmcv 2.2.0 on Python 3.13+ with CUDA Toolkit discovery"

[tool.setuptools]
py-modules = ["sitecustomize"]
