default_scope: mmdet

# All project paths are configured here or in the mode-specific YAML files.
# They are intentionally relative to the repository root.
data_root: ./data
metainfo:
  classes: [root]

log_level: INFO

env_cfg:
  cudnn_benchmark: false
  mp_cfg:
    mp_start_method: fork
    opencv_num_threads: 0
  dist_cfg:
    backend: nccl

default_hooks:
  timer:
    type: IterTimerHook
  logger:
    type: LoggerHook
    interval: 50
  param_scheduler:
    type: ParamSchedulerHook
  checkpoint:
    type: CheckpointHook
    interval: 1
  sampler_seed:
    type: DistSamplerSeedHook
  visualization:
    type: DetVisualizationHook

vis_backends:
  - type: LocalVisBackend
visualizer:
  type: DetLocalVisualizer
  vis_backends:
    - type: LocalVisBackend
  name: visualizer
log_processor:
  type: LogProcessor
  window_size: 50
  by_epoch: true

model:
  type: PointDINO
  num_queries: 900
  with_box_refine: true
  as_two_stage: true
  use_dn: true
  data_preprocessor:
    type: DetDataPreprocessor
    mean: [123.675, 116.28, 103.53]
    std: [58.395, 57.12, 57.375]
    bgr_to_rgb: true
    pad_size_divisor: 1
  backbone:
    type: ResNet
    depth: 50
    num_stages: 4
    out_indices: [1, 2, 3]
    frozen_stages: 1
    norm_cfg:
      type: BN
      requires_grad: false
    norm_eval: true
    style: pytorch
    init_cfg:
      type: Pretrained
      checkpoint: torchvision://resnet50
  neck:
    type: ChannelMapper
    in_channels: [512, 1024, 2048]
    kernel_size: 1
    out_channels: 256
    act_cfg: null
    norm_cfg:
      type: GN
      num_groups: 32
    num_outs: 4
  encoder:
    num_layers: 6
    layer_cfg:
      self_attn_cfg:
        embed_dims: 256
        num_levels: 4
        dropout: 0.0
      ffn_cfg:
        embed_dims: 256
        feedforward_channels: 2048
        ffn_drop: 0.0
  decoder:
    num_layers: 6
    return_intermediate: true
    layer_cfg:
      self_attn_cfg:
        embed_dims: 256
        num_heads: 8
        dropout: 0.0
      cross_attn_cfg:
        embed_dims: 256
        num_levels: 4
        dropout: 0.0
      ffn_cfg:
        embed_dims: 256
        feedforward_channels: 2048
        ffn_drop: 0.0
    post_norm_cfg: null
  positional_encoding:
    num_feats: 128
    normalize: true
    offset: 0.0
    temperature: 20
  bbox_head:
    type: PointDINOHead
    num_classes: 1
    sync_cls_avg_factor: true
    point_euclidean_weight: 0.2
    loss_cls:
      type: FocalLoss
      use_sigmoid: true
      gamma: 2.0
      alpha: 0.25
      loss_weight: 1.0
    loss_bbox:
      type: L1Loss
      loss_weight: 5.0
    loss_iou:
      type: GIoULoss
      loss_weight: 2.0
  dn_cfg:
    label_noise_scale: 0.5
    point_noise_scale: 0.01
    group_cfg:
      dynamic: true
      num_groups: null
      num_dn_queries: 100
  train_cfg:
    assigner:
      type: HungarianAssigner
      match_costs:
        - type: FocalLossCost
          weight: 2.0
        - type: PointL1Cost
          weight: 20.0
  test_cfg:
    max_per_img: 900
    rescale_points: false

# init_detector() requires a test dataset to obtain metainfo and the test
# pipeline. Keeping it public makes both train.yaml and inference.yaml valid.
test_dataloader:
  batch_size: 1
  num_workers: 1
  persistent_workers: true
  sampler:
    type: DefaultSampler
    shuffle: false
  dataset:
    type: BaseDetDataset
    data_root: ./data
    ann_file: val_point.json
    data_prefix:
      img_path: export/
    metainfo:
      classes: [root]
    test_mode: true
    pipeline:
      - type: LoadImageFromFile
      - type: LoadAnnotations
        with_bbox: false
        with_label: false
        with_point: true
      - type: PackDetInputs
        meta_keys: [img_id, img_path, ori_shape, img_shape, scale_factor]
