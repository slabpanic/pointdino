[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointdino"
version = "0.1.0"
description = "PointDINO keypoint detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.8",
    "loguru>=0.7",
    "mmcv==2.2.0",
    "mmengine>=0.7.1,<1.0.0",
    "torch==2.4.1",
]

[project.optional-dependencies]
train = [
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "pycocotools>=2.0.7",
    "scipy>=1.10",
    "shapely>=2.0",
    "terminaltables>=3.1",
    "tqdm>=4.65",
    "torchvision==0.19.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121" },
]
torchvision = [
  { index = "pytorch-cu121" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
find-links = [
    "https://download.openmmlab.com/mmcv/dist/cu121/torch2.4/index.html",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mmdet*", "pointdino*"]

[tool.setuptools.package-dir]
"" = "src"
