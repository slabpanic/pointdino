[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointdino"
version = "0.1.0"
description = "PointDINO keypoint detection"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.14,<5.0",
    "loguru>=0.7",
    "mmcv==2.2.0",
    "mmengine>=0.7.1",
    "torch==2.10.0",
]

[project.optional-dependencies]
train = [
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "pycocotools>=2.0.7",
    "scipy>=1.10",
    "shapely>=2.0",
    "terminaltables>=3.1",
    "tqdm>=4.65",
    "torchvision==0.25.0",
]

[tool.uv.sources]
mmcv-build-compat = { path = "tools/mmcv-build-compat" }
torch = [
  { index = "pypi-public" },
]
torchvision = [
  { index = "pypi-public" },
]

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.extra-build-dependencies]
mmcv = [
  "torch==2.10.0",
  "mmcv-build-compat",
  "setuptools<81",
]

[tool.uv.extra-build-variables]
opencv-python = { CMAKE_ARGS = "-DPYTHON3_LIMITED_API=OFF" }

[dependency-groups]
dev = [
    "black>=26.5.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mmdet*", "pointdino*"]

[tool.setuptools.package-dir]
"" = "src"
